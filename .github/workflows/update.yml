name: update

on: { workflow_dispatch: {}, schedule: [{ cron: "23 */3 * * *" }] }

permissions:
  contents: write

concurrency:
  group: dataset-update
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      SOURCE_ID: ${{ secrets.SOURCE_ID }}
      SOURCE_TEMPLATE: ${{ secrets.SOURCE_TEMPLATE }}

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: build static dataset
        run: python3 tools/sync.py

      - name: publish site branch
        shell: bash
        run: |
          set -euo pipefail

          cp -r build/site /tmp/site

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout --orphan __site_publish__
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true

          mkdir public
          cp -a /tmp/site/. public/

          git add public
          git commit -m "refresh"
          git push --force origin HEAD:site
